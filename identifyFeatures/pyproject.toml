[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identify-features"
version = "0.1.0"
description = "Landmark-anchored Drosophila wing vein identification"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "networkx>=3.0",
    "scikit-image>=0.20",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "pandas>=2.0",
    "psd-tools>=1.9",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
identify-features = "identify_features.cli:main"

[tool.setuptools.packages.find]
include = ["identify_features*"]
