confidence:
  # Active gate — the thresholds the predictor uses on load. Starts as a copy of the
  # Standard tier below. The GUI's Gate Config dialog can override individual
  # landmarks by setting their tier dropdown to "Permissive" (pulls from
  # tiers.permissive), "Standard" (pulls from tiers.standard), or "Strict" (pulls
  # from tiers.strict). "Save as Model Default" writes back to this `confidence:`
  # block (the tier sub-blocks below are preserved on save).
  peak:
    global: 0.205
    per_landmark:
      acv_a: 0.551
      acv_p: 0.205
      alula_notch: 0.233
      dtip: 0.679
      l1_rs: 0.341
      l2_d: 0.496
