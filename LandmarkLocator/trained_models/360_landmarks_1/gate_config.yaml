confidence:
  # Active gate — the thresholds the predictor uses on load. Starts as a copy of the
  # permissive tier below. The GUI's Gate Config dialog can override individual
  # landmarks by setting their tier dropdown to "Strict" (pulls from tiers.strict) or
  # "Permissive" (pulls from tiers.permissive). "Save as Model Default" writes back
  # to this `confidence:` block (the tier sub-block below is preserved on save).
  peak:
    global: 0.108
    per_landmark:
      acv_a: 0.441
      acv_p: 0.127
      alula_notch: 0.108
      dtip: 0.536
      l1_rs: 0.187
