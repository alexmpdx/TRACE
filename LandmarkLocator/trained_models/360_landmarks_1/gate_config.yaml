confidence:
  # Active gate — the thresholds the predictor uses on load. Starts as a copy of the
  # Permissive tier below. The GUI's Gate Config dialog can override individual
  # landmarks by setting their tier dropdown to "Permissive" (pulls from
  # tiers.permissive), "Standard" (pulls from tiers.standard), or "Strict" (pulls
  # from tiers.strict). "Save as Model Default" writes back to this `confidence:`
  # block (the tier sub-blocks below are preserved on save).
  peak:
    global: 0.021
    per_landmark:
      acv_a: 0.089
      acv_p: 0.025
      alula_notch: 0.069
      dtip: 0.134
      l1_rs: 0.028
      l2_d: 0.204
      l2_l3: 0.272
      l4_d: 0.116
      l4_l5: 0.042
      l5_d: 0.069
      pcv_a: 0.021
      pcv_p: 0.169
      subcostal_break: 0.405
  sharpness:
    global: 1.18
    per_landmark:
      acv_a: 1.31
      acv_p: 1.26
      alula_notch: 1.18
      dtip: 1.3
      l1_rs: 1.26
      l2_d: 1.27
      l2_l3: 1.24
      l4_d: 1.26
      l4_l5: 1.23
      l5_d: 1.21
      pcv_a: 1.31
      pcv_p: 1.3
      subcostal_break: 1.25
  second_peak_ratio:
    global: 0.95
    per_landmark:
      acv_a: 0.77
      acv_p: 0.94
      alula_notch: 0.86
      dtip: 0.73
      l1_rs: 0.83
      l2_d: 0.95
      l2_l3: 0.42
      l4_d: 0.95
      l4_l5: 0.55
      l5_d: 0.94
      pcv_a: 0.87
      pcv_p: 0.63
      subcostal_break: 0.41
  second_peak_suppression_radius_px: 30
  core_landmarks:
  - alula_notch
  - dtip
  - l1_rs
  - l2_l3
  - l4_l5
  - subcostal_break
