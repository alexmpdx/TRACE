      acv_p: 1.28
      alula_notch: 1.19
      dtip: 1.31
      l1_rs: 1.28
      l2_d: 1.29
      l2_l3: 1.25
      l4_d: 1.28
      l4_l5: 1.24
      l5_d: 1.24
      pcv_a: 1.32
      pcv_p: 1.31
      subcostal_break: 1.26
  second_peak_ratio:
    global: 0.86
    per_landmark:
      acv_a: 0.44
      acv_p: 0.76
      alula_notch: 0.73
      dtip: 0.58
      l1_rs: 0.6
      l2_d: 0.8
      l2_l3: 0.13
      l4_d: 0.86
      l4_l5: 0.46
      l5_d: 0.82
      pcv_a: 0.67
      pcv_p: 0.5
      subcostal_break: 0.26
  second_peak_suppression_radius_px: 30
  core_landmarks:
  - alula_notch
  - dtip
  - l1_rs
  - l2_l3
  - l4_l5
  - subcostal_break
