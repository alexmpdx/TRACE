# LandmarkLocator default configuration

# Data paths (relative to project root)
data:
  annotation_dir: trainingdata_new3
  image_dir: training_data_pics
  image_suffix: .tif

# Model input resolution (divisible by 32, aspect ratio ~1.45:1)
input:
  width: 512
  height: 352

# Landmark heatmap settings
heatmap:
  sigma: 5  # Gaussian sigma in pixels at model resolution
  # num_landmarks, landmark_order, and geojson_to_landmark are
  # auto-discovered from the annotation files at training time

# Model architecture
model:
  encoder: resnet18
  pretrained: true
  decoder_channels: [256, 128, 64, 32]

# Training
training:
  epochs: 300
  batch_size: 4
  num_workers: 0  # 0 for MPS compatibility
  optimizer:
    type: AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
  scheduler:
    type: CosineAnnealingLR
    T_max: 300  # same as epochs
    eta_min: 1.0e-6
  encoder_freeze_epochs: 20
  encoder_lr_factor: 0.1
  early_stopping_patience: 50

# Cross-validation
cv:
  n_folds: 5
  stratify_by: genotype  # group images by genotype for balanced folds

# Augmentation
augmentation:
  rotation_limit: 30
  horizontal_flip_p: 0.5
  scale_limit: 0.15
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.3
  color_jitter_hue: 0.05
  color_jitter_p: 0.7
  blur_limit: 5
  blur_p: 0.3
  coarse_dropout_max_holes: 4
  coarse_dropout_max_height: 40
  coarse_dropout_max_width: 40
  coarse_dropout_p: 0.3

# Output
output:
  checkpoint_dir: checkpoints
  log_dir: logs

# Inference-time confidence gate
# Applied by LandmarkPredictor.predict(). Thresholds calibrated from testinput_images
# metric distributions; tune per deployment as needed.
confidence:
  # Minimum heatmap peak value. Unknown landmarks fall back to `global`.
  peak:
    global: 0.10
    per_landmark:
      acv_a: 0.20
      acv_p: 0.20
      pcv_a: 0.20
      pcv_p: 0.20
  # Minimum peak / mean(11x11 patch) ratio. Low values indicate diffuse heatmaps.
  # This model produces broader-than-training Gaussians so observed ratios cluster
  # around 1.2-1.6; thresholds are set just below the observed floor.
  sharpness:
    global: 1.15
    per_landmark:
      acv_a: 1.25
      acv_p: 1.25
      pcv_a: 1.25
      pcv_p: 1.25
  # Max allowed (second peak / first peak) after suppressing a disk around the primary.
  # Lower is stricter (catches bimodal heatmaps, e.g. truncated crossveins projecting onto
  # both the actual endpoint and the expected longitudinal-vein intersection).
  second_peak_ratio:
    global: 0.80
    per_landmark:
      acv_a: 0.65
      acv_p: 0.65
      pcv_a: 0.65
      pcv_p: 0.65
  # Suppression radius at model resolution (512x352). ~6x training heatmap sigma.
  second_peak_suppression_radius_px: 30
  # Landmarks whose failure aborts the image.
  # Names match the checkpoint's landmark_order (normalized from GeoJSON names).
  core_landmarks:
    - subcostal_break
    - alula_notch
    - l1_rs
    - l2_l3
    - l4_l5
    - dtip
