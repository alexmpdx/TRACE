[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-estimator"
version = "0.1.0"
description = "Rough µm/px estimation from landmark distance for the TRACE wing pipeline"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scale_estimator*"]
