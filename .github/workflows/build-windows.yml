name: Build Windows installer

# Triggers:
#   - Manual: Actions tab → "Build Windows installer" → Run workflow
#   - Tag: push a tag matching windows-v*  (e.g. windows-v0.1.0) →
#     installer is uploaded as a Release asset on that tag automatically.
on:
  workflow_dispatch:
    inputs:
      use_pyinstaller_cache:
        description: >-
          Reuse PyInstaller's build/ dir between runs.
          Experimental — incremental PyInstaller builds can produce
          subtly-broken installers when imports change. Leave OFF for
          releases. ON is for fast iteration on code-only changes.
        type: boolean
        default: false
  push:
    tags:
      - "windows-v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90  # PyInstaller + Inno Setup on a cold runner
    # The default GITHUB_TOKEN is read-only; softprops/action-gh-release
    # needs `contents: write` to create or update the Release that the
    # installer gets attached to.
    permissions:
      contents: write

    steps:
      - name: Checkout repo (with submodules sibling layout)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the project venv so subsequent runs skip the ~5–15 min
      # pip install when nothing's changed. Key includes the
      # requirements file's hash and the editable-install sibling
      # pyproject.tomls so an edit to any of them auto-invalidates.
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-py3.11-${{
              hashFiles('TRACE/build/requirements-windows.txt',
                        'identifyFeatures/pyproject.toml',
                        'measurementMaker/pyproject.toml',
                        'LandmarkLocator/pyproject.toml')
            }}

      - name: Create venv + install dependencies (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip wheel
          # Consolidated requirements file pulls torch from the PyTorch
          # CPU index. -e installs the sibling packages in editable mode
          # so their modules resolve like they do in dev.
          .\.venv\Scripts\python -m pip install -r TRACE/build/requirements-windows.txt
          .\.venv\Scripts\python -m pip install -e identifyFeatures
          .\.venv\Scripts\python -m pip install -e measurementMaker
          .\.venv\Scripts\python -m pip install -e LandmarkLocator
        shell: pwsh

      - name: Activate venv for downstream steps
        # Prepending the venv's Scripts dir to PATH makes `python` and
        # `pyinstaller` resolve to the venv copies in every subsequent
        # `run:` step.
        run: echo "${{ github.workspace }}\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Read TRACE version from __init__.py
        # Single source of truth for the installed-version string. The
        # iscc invocation below picks this up via /DMyAppVersion=… so
        # we don't have to keep installer.iss's MyAppVersion in lockstep
        # with TRACE/__init__.py manually. The script also fails if the
        # __version__ doesn't match the pushed tag — catches the "tag
        # bumped, code forgotten" foot-gun before it ships.
        id: version
        run: |
          $version = python -c "import re,sys; src=open('TRACE/__init__.py').read(); m=re.search(r'__version__\s*=\s*[\x27\x22]([^\x27\x22]+)', src); sys.stdout.write(m.group(1))"
          if (-not $version) { Write-Error "Could not parse __version__ from TRACE/__init__.py"; exit 1 }
          Write-Host "TRACE __version__ = $version"
          echo "trace_version=$version" >> $env:GITHUB_OUTPUT
          # When triggered by a windows-vX.Y.Z tag, verify the tag's
          # version segment matches the code's __version__.
          $tag_ref = "${{ github.ref }}"
          if ($tag_ref -match '^refs/tags/windows-v(.+)$') {
            $tag_version = $matches[1]
            if ($tag_version -ne $version) {
              Write-Error "Tag version ($tag_version) does not match TRACE.__version__ ($version). Bump them in lockstep."
              exit 1
            }
            Write-Host "Tag $tag_ref matches __version__ — OK"
          }
        shell: pwsh

      # Experimental: reuse PyInstaller's build/ dir across runs so the
      # dep-analysis pass (the slow part) can skip work for unchanged
      # packages. Only fires on a manually-dispatched workflow with the
      # opt-in toggle ON; release tag-pushes always do a cold build for
      # predictability. Cache key is requirements + spec — user-source
      # changes still re-analyze (cheap), but a fresh torch install
      # invalidates everything.
      - name: Cache PyInstaller build/ (experimental, dispatch-only)
        if: github.event_name == 'workflow_dispatch' && inputs.use_pyinstaller_cache
        id: cache-pyi
        uses: actions/cache@v4
        with:
          path: TRACE/build/build
          key: >-
            pyi-${{ runner.os }}-py3.11-${{
              hashFiles('TRACE/build/trace.spec',
                        'TRACE/build/requirements-windows.txt')
            }}

      - name: Run PyInstaller
        run: pyinstaller TRACE/build/trace.spec --noconfirm
        shell: pwsh

      - name: Verify dist contents
        run: |
          dir dist\TRACE
          if (-not (Test-Path dist\TRACE\TRACE.exe)) {
            Write-Error "TRACE.exe missing from dist/"
            exit 1
          }
        shell: pwsh

      - name: Install Inno Setup
        # Chocolatey is pre-installed on windows-latest. innosetup is the
        # official package; --no-progress quiets the install log.
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        # Chocolatey installs Inno Setup to C:\Program Files (x86)\Inno Setup 6.
        # Call iscc by full path so we don't depend on the post-install PATH
        # refresh taking effect in this shell. Pass MyAppVersion via /D so
        # installer.iss uses the parsed __version__ rather than its own
        # hard-coded value (single source of truth).
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & "$iscc" `
            "/DSourceDir=..\..\dist\TRACE" `
            "/DMyAppVersion=${{ steps.version.outputs.trace_version }}" `
            TRACE\build\installer.iss
        shell: pwsh

      - name: Upload installer artifact
        # Artifacts are downloadable from the Actions run page even for
        # workflow_dispatch builds (handy for testing before tagging).
        uses: actions/upload-artifact@v4
        with:
          name: TRACE-Setup
          path: TRACE/build/Output/TRACE-Setup.exe
          retention-days: 30

      - name: Extract tag commit body as release notes
        # softprops/action-gh-release accepts a `body_path` file whose
        # contents become the human-readable Release description shown on
        # the GitHub Releases page (and in the Help-tab updater). The
        # project's convention is to write a detailed body on every
        # release commit (what changed + why); this step surfaces that
        # body as the release description so users don't have to click
        # through to the commit. `generate_release_notes: true` below
        # then APPENDS the auto-generated "Full Changelog" link.
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        run: |
          set -euo pipefail
          # Skip the subject (first line) — softprops uses `name` for that;
          # duplicating it in the body reads noisily.
          git log -1 --format=%b "${{ github.ref_name }}" > RELEASE_NOTES.md
          # If the body is empty (no body on the tag commit), leave a
          # placeholder so the release doesn't render with an empty section.
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "_No release notes written on the tag commit._" > RELEASE_NOTES.md
          fi
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: Attach to GitHub Release
        # Only when triggered by a windows-v* tag — uploads the installer
        # as a release asset so end users can download it from the
        # Releases page without digging through Actions artifacts.
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: TRACE/build/Output/TRACE-Setup.exe
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          # `generate_release_notes: true` appends the "Full Changelog"
          # comparison link + auto-summarized merged PRs (if any) beneath
          # the body_path contents.
          generate_release_notes: true
