                                                                                                                 
  name: Build Windows Executable                                                                                 
                                                                                                                 
  on:                                                                                                            
    workflow_dispatch:                                                                                           
      inputs:                                                                                                    
        version:                                                                                                 
          description: "Version tag (e.g., v1.0.0)"
          required: false
          default: "dev"
    release:                                                                                                     
      types: [created]
                                                                                                                 
  jobs:                                                                                                        
    build:
      runs-on: windows-latest
      if: github.event_name != 'release' || github.event.release.tag_name != 'model'
      defaults:                                                                                                  
        run:
          shell: bash                                                                                            
                                                                                                               
      steps:                                                                                                     
        - name: Checkout repository                                                                            
          uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
                                                                                                                 
        - name: Install PyTorch CPU                                                                              
          run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu                    
                                                                                                                 
        - name: Install LandmarkLocator                                                                        
          run: pip install -e ./LandmarkLocator
                                                                                                                 
        - name: Install remaining deps
          run: pip install opencv-python numpy pyyaml pyinstaller                                                
                                                                                                               
        - name: Download model checkpoint                                                                                                                 
          env:                                                                                                                                          
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: mkdir -p EZcheezeMeasure/trained_model && gh release download "model" --pattern "landmark_model_grace.5.pt" --dir                          
  EZcheezeMeasure/trained_model --repo "${{ github.repository }}"                                                                                    
                                                                                                                 
        - name: Build with PyInstaller                                                                           
          run: |                                                                                                 
            cd EZcheezeMeasure                                                                                 
            pyinstaller EZcheezeMeasure.spec --noconfirm
                                                                                                                 
        - name: Verify build
          run: test -f EZcheezeMeasure/dist/EZcheezeMeasure/EZcheezeMeasure.exe                                  
                                                                                                                 
        - name: Create ZIP archive
          run: |                                                                                                 
            cd EZcheezeMeasure/dist                                                                            
            7z a -tzip ../../EZcheezeMeasure-windows.zip EZcheezeMeasure/                                        
                                                                                                                 
        - name: Upload build artifact                                                                            
          uses: actions/upload-artifact@v4                                                                       
          with:                                                                                                
            name: EZcheezeMeasure-windows                                                                        
            path: EZcheezeMeasure-windows.zip                                                                    
            retention-days: 30                                                                                   
                                                                                                                 
        - name: Attach to release                                                                                
          if: github.event_name == 'release'
          env:                                                                                                   
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}                                                              
            TAG: ${{ github.event.release.tag_name }}                                                            
            REPO: ${{ github.repository }}                                                                     
          run: gh release upload "$TAG" EZcheezeMeasure-windows.zip --repo "$REPO"                               
